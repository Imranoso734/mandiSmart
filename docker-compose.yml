services:
  db:
    container_name: mandismart-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mandi
      POSTGRES_PASSWORD: mandi123
      POSTGRES_DB: mandismart
    ports:
      - "5433:5432"
    volumes:
      - mandismart-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandi -d mandismart"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mandismart-postgres-data:
