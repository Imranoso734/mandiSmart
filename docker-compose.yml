services:
  db:
    container_name: mandismart-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mandi
      POSTGRES_PASSWORD: mandi123
      POSTGRES_DB: mandismart
    ports:
      - "5433:5432"
    volumes:
      - mandismart-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandi -d mandismart"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    container_name: mandismart-api
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://mandi:mandi123@db:5432/mandismart?schema=public

volumes:
  mandismart-postgres-data:
